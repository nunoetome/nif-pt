default:
  retry_count: 1
  timeout: 10
  tempo_de_espera: 60
  # Tratamento de erros rate-limit nif.pt — tempos de espera por janela
  tempo_espera_minuto: 60
  tempo_espera_hora: 3600
  # Limites de tentativas — por tipo de erro e global
  max_tentativas_global: 5
  max_tentativas_minuto: 3
  max_tentativas_hora: 2
  max_tentativas_dia: 0
  max_tentativas_mes: 0
  max_tentativas_paid: 0
  # Validação cache SQLite — evita pedidos repetidos para NIFs recentes
  cache_ativo: true
  cache_antiguidade_dias: 30
  cache_tabela_ignorados: "nif_ignorados"

# ==============================================================================
# consulta_nif.py — consulta à API pública nif.pt
# ==============================================================================
consulta_nif:
  api_base: "http://www.nif.pt"

# ==============================================================================
# importar_nif_sqlite.py — guarda o JSON da API em SQLite local
# ==============================================================================
importar_nif_sqlite:
  db_path: "data/nif_pt.db"
  tabela: "nif_pt"
